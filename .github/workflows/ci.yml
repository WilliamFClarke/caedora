name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR replaces the older run instead of queueing
# behind it for a runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build, unit and Playwright tests
    runs-on: ubuntu-latest
    # One job, so each run waits for a single runner and the app is only
    # built once (the e2e script builds the standalone server it tests).
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install scripts only fetch Electron and native desktop binaries, which
      # the web build and tests never use.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Build and run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
